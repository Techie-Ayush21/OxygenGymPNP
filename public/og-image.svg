<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="ogGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#EF2929" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#D91F25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Badge / Eyebrow -->
  <rect x="80" y="80" width="280" height="40" rx="6" fill="#151517" stroke="rgba(239, 41, 41, 0.5)" stroke-width="1.5"/>
  <circle cx="102" cy="100" r="6" fill="#EF2929"/>
  <text x="120" y="105" font-family="'Oswald', sans-serif" font-size="14" font-weight="700" fill="#F7F5F2" letter-spacing="2">MODEL TOWN · PANIPAT</text>

  <!-- Main Headline -->
  <text x="80" y="220" font-family="'Oswald', sans-serif" font-size="82" font-weight="700" fill="#F7F5F2" letter-spacing="2">OXYGEN GYM</text>
  <text x="80" y="300" font-family="'Oswald', sans-serif" font-size="52" font-weight="700" fill="#EF2929" letter-spacing="1">BUILD YOUR STRONGER SELF.</text>

  <!-- Supporting Subtext -->
  <text x="80" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="400" fill="#B7B2B0">Premier strength training, calibrated iron &amp; cardio deck in Panipat.</text>
  <text x="80" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="400" fill="#7A7674">Open Mon – Sat: 5:30 AM – 10:30 PM | Sun: 9:00 AM – 2:30 PM</text>

  <!-- Bottom Badges / Differentiators -->
  <g transform="translate(80, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="6" fill="#151517" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="110" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#F7F5F2" text-anchor="middle">Heavy Free Weights</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="52" rx="6" fill="#151517" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="350" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#F7F5F2" text-anchor="middle">Incline Cardio Deck</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="52" rx="6" fill="#151517" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="590" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#F7F5F2" text-anchor="middle">Conditioning Turf</text>

    <!-- WhatsApp Pill -->
    <rect x="720" y="0" width="260" height="52" rx="6" fill="#EF2929"/>
    <text x="850" y="32" font-family="'Oswald', sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WHATSAPP: 07742124209</text>
  </g>

  <!-- Large Decorative 'O' Brand Mark on Right -->
  <g transform="translate(980, 240)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#EF2929" stroke-width="24" opacity="0.6"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="8"/>
    <circle cx="0" cy="0" r="28" fill="#EF2929" opacity="0.9"/>
  </g>
</svg>
